<div class="flex flex-col gap-1">
  <label pLabel class="text-sm" for="gender">Género <span class="text-accent-500">*</span></label>
  <p-select
    id="gender"
    [formControl]="control()"
    [options]="genderOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="Género"
    appendTo="body"
  />

  @if (control().invalid && control().touched) {
    <p-message severity="error" size="small" variant="simple">
      @if (control().hasError('required')) {
        El género es obligatorio.
      }
    </p-message>
  }
</div>
