<section class="pt-6 pb-16 w-full max-w-[1180px] mx-auto">
  <div class="bg-(--p-forest-deep) rounded-3xl p-6 md:p-10 lg:p-14 flex flex-col lg:flex-row gap-4">
    <!-- EMPRESA -->
    <div class="flex-1 flex flex-col gap-4 bg-(--p-forest-mid) p-8 rounded-3xl">
      <h2 class="text-white text-3xl font-bold">
        {{ empresaCandidato()[0].titulo }}
      </h2>
      <p class="font-light text-sm text-white leading-6">
        {{ empresaCandidato()[0].subtitulo }}
      </p>
      <p-button
        label="Empresa"
        icon="pi pi-arrow-right"
        iconPos="right"
        variant="outlined"
        [style]="{ 'background-color': 'white' }"
        routerLink="/login-empresarial"
      />
    </div>
    <!-- CANDIDATO -->
    <div class="flex-1 flex flex-col gap-4 bg-white p-8 rounded-3xl">
      <h2 class="text-3xl font-bold">
        {{ empresaCandidato()[1].titulo }}
      </h2>
      <p class="font-light text-sm leading-6">
        {{ empresaCandidato()[1].subtitulo }}
      </p>
      <p-button
        label="Candidato"
        icon="pi pi-arrow-right"
        iconPos="right"
        routerLink="/login-candidato"
      />
    </div>
  </div>
</section>
