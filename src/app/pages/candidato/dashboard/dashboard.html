<div class="p-4">
  <div class="w-full">
    <h1 class="text-2xl">Dashboard</h1>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-4">
    <div class="bg-white p-4 rounded-xl">
      <h2>Activos</h2>
    </div>
    <div class="bg-white p-4 rounded-xl">
      <h2>Evaluados</h2>
    </div>
    <div class="bg-white p-4 rounded-xl">
      <h2>Programados</h2>
    </div>
    <div class="bg-white p-4 rounded-xl">
      <h2>Este mes</h2>
    </div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
    <div class="bg-white p-4 rounded-xl">
      <h2>Embudo de Selección</h2>
    </div>
    <div class="bg-white p-4 rounded-xl">
      <h2 class="mb-4">Mis Postulaciones</h2>
      <app-doughnut-chart [chartData]="misPostulacionesData" [tituloTooltip]="tituloTooltip" />
    </div>
  </div>
</div>
