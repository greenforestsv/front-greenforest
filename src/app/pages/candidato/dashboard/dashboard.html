<div class="py-4 px-10">
  <h1 class="text-2xl w-full">Mi Dashboard</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
    <div class="flex flex-col gap-4">
      <!-- PERFIL -->
      <div
        class="w-full shadow-sm bg-white rounded-3xl p-6 flex flex-col sm:flex-row items-center gap-5"
      >
        <div class="ring-4 ring-(--p-forest-mist) rounded-full p-1 shrink-0">
          <p-avatar
            icon="pi pi-user"
            size="xlarge"
            shape="circle"
            class="bg-(--p-forest-mid) text-white flex items-center justify-center !w-24 !h-24 text-2xl"
          />
        </div>
        <div class="text-center sm:text-left space-y-1">
          <h2 class="text-2xl font-bold tracking-tight">Mary Jane Watson</h2>
          <p class="text-base font-medium text-gray-600">Desarrolladora Fullstack</p>
        </div>
      </div>

      <!-- POSTULACIONES -->
      <div class="shadow-sm bg-white p-4 rounded-xl">
        <h2 class="mb-4">Mis Postulaciones</h2>
        <app-doughnut-chart [chartData]="misPostulacionesData" [tituloTooltip]="tituloTooltip" />
      </div>

      <!-- ENTREVISTAS -->
      <div class="shadow-sm bg-white p-4 rounded-xl">
        <h2 class="mb-4">Próximas Entrevistas</h2>
        <div class="card flex justify-center">
          <app-entrevistas class="w-full" />
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-4">
      <!-- VISTAS -->
      <div class="shadow-sm bg-white p-4 rounded-xl">
        <h2 class="mb-4">Visitas a mi Perfil</h2>
        <app-line-chart />
      </div>

      <!-- OFERTAS -->
      <div class="shadow-sm bg-white py-4 rounded-xl max-h-[600px] overflow-y-auto">
        <h2 class="pb-4 ml-4">Ofertas que te pueden interesar</h2>
        <app-lista-ofertas class="overflow-y-auto h-full" />
      </div>
    </div>
  </div>
</div>
