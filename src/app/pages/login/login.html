<div class="card-demo">
  <div id="logo-green-forest" class="hover:cursor-pointer logo mx-auto" routerLink="/"></div>
  <div class="text-center mb-8">
    <h1 class="text-(--p-forest-primary) mt-2 text-3xl font-light">Inicia sesión</h1>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-7">
    <p-floatlabel>
      <input pInputText id="correo" autocomplete="off" [fluid]="true" />
      <label for="correo">Correo</label>
    </p-floatlabel>
    <p-floatlabel class="w-full">
      <p-password
        inputId="password"
        formControlName="password"
        [toggleMask]="true"
        [feedback]="false"
        class="w-full"
        [fluid]="true"
      />
      <label for="password">Contraseña</label>
    </p-floatlabel>

    <div class="flex justify-end">
      <p-button label="¿Olvidaste tu contraseña?" routerLink="/" link />
    </div>

    <p-button label="Iniciar Sesión" type="submit" [fluid]="true" />
  </form>

  <div class="text-center">
    <p>
      ¿No tenés una cuenta?
      <p-button label="Crear cuenta" routerLink="/" link />
    </p>
  </div>
</div>
