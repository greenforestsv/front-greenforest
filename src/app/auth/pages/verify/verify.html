<div class="relative min-h-screen overflow-hidden">
  <!-- Imagen de fondo -->
  <img
    src="/bosque-1.jpg"
    alt=""
    loading="lazy"
    decoding="async"
    class="absolute inset-0 h-full w-full object-cover object-bottom -z-20 select-none"
  />

  <div class="flex min-h-screen items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md rounded-3xl bg-white px-6 py-7 shadow-xl sm:px-8">
      <div class="logo mx-auto cursor-pointer" routerLink="/"></div>

      <div class="mb-8 text-center">
        <h1 class="mt-2 text-3xl font-light text-primary">Verificación</h1>
      </div>

      <form [formGroup]="verifyForm" (ngSubmit)="verify()" class="space-y-6">
        <p-floatlabel>
          <input
            pInputText
            id="code"
            autocomplete="code"
            [fluid]="true"
            formControlName="code"
            autofocus
          />
          <label for="code">Código de verificación</label>
        </p-floatlabel>

        <p-button label="Comfirmar" type="submit" [fluid]="true" [loading]="loading()" />
      </form>
    </div>
  </div>
</div>
