<div class="relative min-h-screen overflow-hidden">
  <!-- Imagen de fondo -->
  <img
    src="/bosque-1.jpg"
    alt=""
    loading="lazy"
    decoding="async"
    class="absolute inset-0 h-full w-full object-cover object-bottom -z-20 select-none"
  />

  <div class="flex min-h-screen items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md rounded-3xl bg-white px-6 py-7 shadow-xl sm:px-8">
      <div class="logo mx-auto cursor-pointer" routerLink="/"></div>

      <div class="mb-12 text-center">
        <h1 class="mt-2 text-3xl font-light text-primary">Recuperar Contraseña</h1>
      </div>

      <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()" class="space-y-6">
        <p-floatlabel>
          <input
            pInputText
            id="correo"
            autocomplete="email"
            [fluid]="true"
            formControlName="email"
          />
          <label for="correo">Correo</label>
        </p-floatlabel>

        <p-button label="Enviar" type="submit" [fluid]="true" [loading]="loading()" />
      </form>

      <div class="mt-5 text-center text-sm">
        <p-button label="Volver a inicio de sesión" routerLink="/login-candidato" link />
      </div>
    </div>
  </div>
</div>
