<div class="background flex items-center">
  <div class="px-7 py-6 rounded-3xl bg-white mx-auto w-full max-w-md shadow-sm">
    <div class="hover:cursor-pointer logo mx-auto" routerLink="/"></div>
    <div class="text-center mb-8">
      <h1 class="text-primary mt-2 text-3xl font-light">Inicia sesión</h1>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-4">
      <div class="space-y-6">
        <div>
          <p-floatlabel>
            <input
              pInputText
              type="email"
              id="correo"
              autocomplete="email"
              [fluid]="true"
              formControlName="email"
              [invalid]="
                (loginForm.controls.email.invalid && loginForm.controls.email.touched) ||
                loginForm.hasError('invalidCredentials')
              "
            />
            <label for="correo">Correo</label>
          </p-floatlabel>
          @if (email.invalid && email.touched) {
            <p-message severity="error" size="small" variant="simple" class="mt-1">
              @if (email.hasError('required')) {
                El correo es obligatorio.
              }
            </p-message>
          }
        </div>

        <div>
          <p-floatlabel class="w-full mt-8">
            <p-password
              inputId="password"
              formControlName="password"
              [toggleMask]="true"
              [feedback]="false"
              [fluid]="true"
              class="w-full"
              [invalid]="
                (loginForm.controls.password.invalid && loginForm.controls.password.touched) ||
                loginForm.hasError('invalidCredentials')
              "
            />
            <label for="password">Contraseña</label>
          </p-floatlabel>
          @if (password.invalid && password.touched) {
            <p-message severity="error" size="small" variant="simple" class="mt-1">
              @if (password.hasError('required')) {
                La contraseña es obligatoria.
              }
            </p-message>
          }
        </div>
      </div>

      <div>
        <!-- <div class="flex justify-end">
          <p-button label="¿Olvidaste tu contraseña?" routerLink="/olvido-contrasena" link />
        </div> -->
        <p-button label="Iniciar Sesión" type="submit" [fluid]="true" [loading]="loading()" />
        <div class="flex justify-end items-center mt-2">
          ¿No tenés una cuenta?
          <p-button label="Crear cuenta" routerLink="/registro-empresa" link />
        </div>
      </div>
    </form>
  </div>
</div>
