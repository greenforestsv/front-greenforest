<div
  class="bg-white border border-gray-200 rounded-xl p-6 shadow-xs hover:shadow-md transition-all duration-200 flex flex-col justify-between gap-4"
>
  <div>
    <div class="flex justify-between items-start gap-4 mb-2">
      <h3
        class="text-lg font-bold text-gray-900 hover:text-[var(--p-primary-500)] cursor-pointer transition-colors"
      >
        {{ empleo().puesto }}
      </h3>
      <span class="text-xs text-gray-400 whitespace-nowrap">{{ empleo().fecha }}</span>
    </div>

    <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-500 mb-4">
      <span class="flex items-center gap-1">
        <i class="pi pi-building text-xs text-[var(--p-primary-500)]"></i>
        {{ empleo().empresa }}
      </span>
      <span class="flex items-center gap-1">
        <i class="pi pi-map-marker text-xs text-red-400"></i> {{ empleo().ubicacion }}
      </span>
      <span class="flex items-center gap-1 font-medium text-gray-700">
        ${{ empleo().salario | number }}
        / mes
      </span>
    </div>

    <p class="text-sm text-gray-600 line-clamp-2 leading-relaxed">
      {{ empleo().descripcion }}
    </p>
  </div>

  <div class="flex flex-wrap justify-between items-center gap-4 pt-4 border-t border-gray-100">
    <div class="flex flex-wrap gap-2">
      <p-badge [value]="empleo().modalidad" severity="success" class="text-xs"></p-badge>
      @for (tag of empleo().tags; track tag) {
        <span class="text-xs bg-gray-100 text-gray-600 px-2,5 py-1 rounded-md font-medium">
          {{ tag }}
        </span>
      }
    </div>

    <button
      pButton
      label="Postularme"
      size="small"
      icon="pi pi-arrow-right"
      iconPos="right"
      class="p-button"
    ></button>
  </div>
</div>
