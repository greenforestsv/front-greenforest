<div class="space-y-4">
  @if (loading()) {
    @for (item of items; track $index) {
      <p-skeleton width="100%" height="8.7rem" borderRadius="1rem" />
    }
    <div class="flex justify-center">
      <p-paginator
        (onPageChange)="onPageChange($event)"
        [first]="0"
        [rows]="10"
        [totalRecords]="100"
        [rowsPerPageOptions]="[10, 20, 30]"
      />
    </div>
  } @else {
    <div class="flex flex-col gap-2">
      @for (job of jobs(); track job.id) {
        <div class="card p-6 space-y-2">
          <div class="flex gap-2 justify-between flex-wrap">
            <h2 class="font-bold inter-font">{{ job.title }}</h2>
            <span class="font-bold">{{ job.min_salary }} - {{ job.max_salary }}</span>
          </div>
          <p class="text-sm text-gray-600">
            {{ job.description }}
          </p>
          <div class="flex justify-between items-center">
            <ul class="flex gap-2 items-center flex-wrap">
              @for (tag of job.tools; track $index) {
                <span class="green-badge">{{ tag }}</span>
              }
            </ul>
            <p-button
              label="Aplicar"
              size="small"
              (onClick)="applyToJob(job.id, job.original_tenant_id)"
            />
          </div>
        </div>
      }
    </div>
    <div class="flex justify-center">
      <p-paginator
        (onPageChange)="onPageChange($event)"
        [first]="first"
        [rows]="rows"
        [totalRecords]="totalRecords()"
        [rowsPerPageOptions]="rowsPerPageOptions"
      />
    </div>
  }
</div>
