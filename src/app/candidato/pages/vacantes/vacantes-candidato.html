<div class="p-4">
  <div class="flex flex-col gap-4">
    <section class="card p-8 flex flex-col gap-2">
      <h1 class="text-2xl inter-font font-bold mb-2">Buscar Empresas</h1>
      <form
        [formGroup]="search_form"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-[1fr_1fr_1fr_auto] gap-3 items-end"
      >
        <input pInputText id="name" placeholder="Buscar por nombre" formControlName="name" fluid />

        <input
          pInputText
          id="department"
          placeholder="Buscar por departamento"
          formControlName="department"
          fluid
        />

        <input
          pInputText
          id="format"
          placeholder="Buscar por modalidad"
          formControlName="format"
          fluid
        />

        <input
          pInputText
          id="format"
          placeholder="Buscar por modalidad"
          formControlName="format"
          fluid
        />

        <input
          pInputText
          id="format"
          placeholder="Buscar por modalidad"
          formControlName="format"
          fluid
        />

        <p-button label="Buscar" (onClick)="jobs.loadJobs(true)" [loading]="jobs.loading()" />
      </form>
    </section>

    <!-- JOB CARDS -->
    <app-paginated-jobs #jobs [filters]="search_form.getRawValue()" />
  </div>
