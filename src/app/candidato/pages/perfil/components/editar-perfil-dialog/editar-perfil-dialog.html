<div class="flex justify-center">
  <p-button
    icon="pi pi-pencil"
    class="flex"
    [rounded]="true"
    size="small"
    [label]="'perfil.candidato.editar_perfil' | translate"
    (click)="visible.set(true)"
  />
  <p-dialog
    [(visible)]="visible"
    [modal]="true"
    [header]="'perfil.candidato.editar_perfil' | translate"
    [style]="{ width: '36rem', borderRadius: '1.5rem' }"
  >
    <form id="perfilForm" [formGroup]="perfilForm" (ngSubmit)="save()" class="flex flex-col gap-4">
      <!-- Título -->
      <div class="flex flex-col gap-1">
        <label for="title">Título <span class="text-accent-500">*</span></label>
        <input
          pInputText
          id="title"
          formControlName="title"
          [invalid]="title.invalid && title.touched"
          fluid
        />
        @if (title.invalid && title.touched) {
          <p-message severity="error" size="small" variant="simple">
            El título es obligatorio.
          </p-message>
        }
      </div>

      <!-- Descripción -->
      <div class="flex flex-col gap-1">
        <label for="description">Descripción <span class="text-accent-500">*</span></label>
        <textarea
          pTextarea
          id="description"
          formControlName="description"
          rows="5"
          [autoResize]="true"
          [invalid]="description.invalid && description.touched"
        ></textarea>
        @if (description.invalid && description.touched) {
          <p-message severity="error" size="small" variant="simple">
            La descripción es obligatoria.
          </p-message>
        }
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <!-- Fecha de cierre -->
        <div class="flex flex-col gap-1">
          <label for="ends_on">Fecha de cierre <span class="text-accent-500">*</span></label>
          <p-datepicker
            id="ends_on"
            formControlName="ends_on"
            [showIcon]="true"
            dateFormat="dd/M/yy"
            [invalid]="ends_on.invalid && ends_on.touched"
          />
          @if (ends_on.invalid && ends_on.touched) {
            <p-message severity="error" size="small" variant="simple">
              La fecha de cierre es obligatoria.
            </p-message>
          }
        </div>

        <!-- Área -->
        <div class="flex flex-col gap-1">
          <label for="area">Área <span class="text-accent-500">*</span></label>
          <input
            pInputText
            id="area"
            formControlName="area"
            [invalid]="area.invalid && area.touched"
            fluid
          />
          @if (area.invalid && area.touched) {
            <p-message severity="error" size="small" variant="simple">
              El área es obligatoria.
            </p-message>
          }
        </div>

        <!-- Salario mínimo -->
        <div class="flex flex-col gap-1">
          <label for="min_salary">Salario mínimo <span class="text-accent-500">*</span></label>
          <p-inputnumber
            inputId="min_salary"
            formControlName="min_salary"
            mode="currency"
            currency="USD"
            locale="en-US"
            [invalid]="min_salary.invalid && min_salary.touched"
            fluid
          />
        </div>

        <!-- Salario máximo -->
        <div class="flex flex-col gap-1">
          <label for="max_salary">Salario máximo <span class="text-accent-500">*</span></label>
          <p-inputnumber
            inputId="max_salary"
            formControlName="max_salary"
            mode="currency"
            currency="USD"
            locale="en-US"
            [invalid]="max_salary.invalid && max_salary.touched"
            fluid
          />
        </div>

        <!-- Tipo de jornada -->
        <div class="flex flex-col gap-1">
          <label for="workday_type">Tipo de jornada <span class="text-accent-500">*</span></label>
          <input
            pInputText
            id="workday_type"
            formControlName="workday_type"
            [invalid]="workday_type.invalid && workday_type.touched"
            fluid
          />
        </div>

        <!-- Jornada -->
        <div class="flex flex-col gap-1">
          <label for="workday">Jornada <span class="text-accent-500">*</span></label>
          <input pInputText id="workday" formControlName="workday" fluid />
        </div>

        <!-- Tipo de contrato -->
        <div class="flex flex-col gap-1">
          <label for="contract_type">Tipo de contrato <span class="text-accent-500">*</span></label>
          <input
            pInputText
            id="contract_type"
            formControlName="contract_type"
            [invalid]="contract_type.invalid && contract_type.touched"
            fluid
          />
        </div>

        <!-- Modalidad -->
        <div class="flex flex-col gap-1">
          <label for="format">Modalidad <span class="text-accent-500">*</span></label>
          <input
            pInputText
            id="format"
            formControlName="format"
            [invalid]="format.invalid && format.touched"
            fluid
          />
        </div>

        <!-- Fechas de pago -->
        <div class="flex flex-col gap-1 lg:col-span-2">
          <label for="payment_dates">Fechas de pago <span class="text-accent-500">*</span></label>
          <input
            pInputText
            id="payment_dates"
            formControlName="payment_dates"
            [invalid]="payment_dates.invalid && payment_dates.touched"
            fluid
          />
        </div>

        <!-- Skills -->
        <div class="flex flex-col gap-1">
          <label for="skills">Skills</label>
          <textarea
            pTextarea
            id="skills"
            formControlName="skills"
            rows="3"
            [autoResize]="true"
          ></textarea>
        </div>

        <!-- Herramientas -->
        <div class="flex flex-col gap-1">
          <label for="tools">Herramientas</label>
          <textarea
            pTextarea
            id="tools"
            formControlName="tools"
            rows="3"
            [autoResize]="true"
          ></textarea>
        </div>

        <!-- Requisitos -->
        <div class="flex flex-col gap-1 lg:col-span-2">
          <label for="requirements">Requisitos</label>
          <textarea
            pTextarea
            id="requirements"
            formControlName="requirements"
            rows="4"
            [autoResize]="true"
          ></textarea>
        </div>
      </div>

      <button type="submit" hidden></button>
    </form>
    <!-- BOTONES -->
    <ng-template pTemplate="footer">
      <p-button
        [label]="'common.cancelar' | translate"
        (click)="closeDialog()"
        severity="secondary"
        variant="outlined"
      />
      <p-button
        type="button"
        [loading]="loading()"
        (click)="save()"
        [label]="'common.guardar' | translate"
      />
    </ng-template>
  </p-dialog>
</div>
