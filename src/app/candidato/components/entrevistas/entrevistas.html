<div class="flex flex-col items-start md:flex-row gap-4 justify-center">
  <div class="flex flex-col border border-gray-200 rounded-xl divide-y divide-gray-200 bg-white">
    @for (entrevista of entrevistas(); track entrevista.id) {
      <div class="flex items-center gap-3 p-4 hover:bg-gray-50 transition-colors">
        <div class="shrink-0">
          <p-avatar [label]="entrevista.empresa[0]" size="large" shape="circle" />
        </div>

        <div class="flex-1 min-w-0">
          <p class="font-medium text-(--p-forest-mid)">
            {{ entrevista.empresa }}
          </p>

          <div class="flex flex-wrap items-center gap-2 text-sm text-gray-500">
            <span>
              {{ entrevista.fecha | date: "dd '-' MMMM" }}
            </span>

            <span class="text-(--p-forest-lite)">•</span>

            <span>
              {{ entrevista.hora }}
            </span>
          </div>
        </div>
      </div>
    }
  </div>
  <p-datepicker
    [ngModel]="fechasEntrevistas()"
    [readonlyInput]="true"
    [inline]="true"
    selectionMode="multiple"
  >
  </p-datepicker>
</div>
