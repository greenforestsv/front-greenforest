<div class="flex justify-center">
  <p-button
    icon="pi pi-pencil"
    class="flex"
    [rounded]="true"
    size="small"
    label="Editar"
    (click)="openDialog()"
  />
  <p-dialog
    [(visible)]="visible"
    [modal]="true"
    header="Editar vacante"
    [style]="{ width: '36rem', borderRadius: '1.5rem' }"
  >
    <!-- FORMULARIO -->
    @if (loadingVacante()) {
      <div class="flex flex-col gap-4">
        <p-skeleton width="100%" height="2.5rem" />
        <p-skeleton width="100%" height="2.5rem" />
        <p-skeleton width="100%" height="2.5rem" />
        <p-skeleton width="100%" height="2.5rem" />
      </div>
    } @else {
      <app-vacante-form [form]="vacanteForm" />
    }

    <!-- BOTONES -->
    <ng-template pTemplate="footer">
      <p-button
        [label]="'common.cancelar' | translate"
        (click)="closeDialog()"
        severity="secondary"
        variant="outlined"
      />
      <p-button
        type="button"
        [loading]="loading() || loadingVacante()"
        (click)="save()"
        [label]="'common.guardar' | translate"
      />
    </ng-template>
  </p-dialog>
</div>
