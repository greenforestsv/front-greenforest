<div class="flex justify-center">
  <p-button
    icon="pi pi-plus"
    class="flex"
    [rounded]="true"
    size="small"
    label="Nueva vacante"
    (click)="visible.set(true)"
  />
  <p-dialog
    [(visible)]="visible"
    [modal]="true"
    header="Crear vacante"
    [style]="{ width: '36rem', borderRadius: '1.5rem' }"
  >
    <!-- FORMULARIO -->
    <app-vacante-form [form]="vacanteForm" />
    <!-- BOTONES -->
    <ng-template pTemplate="footer">
      <p-button
        [label]="'common.cancelar' | translate"
        (click)="closeDialog()"
        severity="secondary"
        variant="outlined"
      />
      <p-button
        type="button"
        [loading]="loading()"
        (click)="save()"
        [label]="'common.guardar' | translate"
      />
    </ng-template>
  </p-dialog>
</div>
