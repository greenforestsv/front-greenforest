<div class="p-4 pt-0 lg:pl-0 flex flex-col md:flex-row lg:flex-col xl:flex-row gap-4 w-full">
  @if (loading()) {
    <p-skeleton width="100%" height="16rem" borderRadius="1.5rem" />
  } @else if (perfil(); as empresa) {
    <div class="flex-2 flex flex-col gap-4">
      <app-empresa-profile [perfil]="empresa" [editable]="true" />
    </div>
  }
</div>
