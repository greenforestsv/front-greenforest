<section class="py-16 mx-auto font-sans max-w-[1180px]">
  <div class="text-center mb-12">
    <span
      class="text-xs bg-white py-2 px-3 rounded-full text-mid font-bold w-fit shadow-md before:content-[''] before:inline-block before:size-2 before:rounded-full before:bg-mid before:mr-2"
      >Historias que perduran</span
    >
    <h2 class="mt-6 text-5xl text-gray-950 mb-3">Lo que dicen nuestros usuarios</h2>

    <!-- <p class="font-light max-w-xl mx-auto">
      Descubre las historias de éxito de profesionales que impulsaron su carrera utilizando nuestro
      portal de empleo.
    </p> -->
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    @for (testimonio of testimonios(); track testimonio.nombre) {
      <div
        class="bg-white border border-gray-100 rounded-3xl p-8 shadow-xs flex flex-col justify-between relative group hover:shadow-md hover:-translate-y-1 transition-all duration-300"
      >
        <span
          class="absolute top-2 right-5 text-7xl text-lite opacity-40 select-none playfair-font"
        >
          ”
        </span>

        <div class="mb-6">
          <p class="text-gray-700 italic leading-relaxed text-sm">"{{ testimonio.comentario }}"</p>
        </div>

        <div class="flex items-center gap-4 pt-4 border-t border-gray-50">
          <p-avatar
            [label]="testimonio.avatar"
            shape="circle"
            size="large"
            class="bg-(--p-primary-100) text-(--p-primary-700) font-bold"
          >
          </p-avatar>

          <div class="flex flex-col">
            <span class="text-gray-900">
              {{ testimonio.nombre }}
            </span>

            <span class="text-xs text-gray-500">
              {{ testimonio.puesto }} en
              <strong class="text-(--p-primary-600) font-medium">
                {{ testimonio.empresa }}
              </strong>
            </span>
          </div>
        </div>
      </div>
    }
  </div>
</section>
