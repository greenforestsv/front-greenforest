<section
  class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 w-full mt-8 max-w-[1180px] mx-auto"
>
  @for (item of estadisticas(); track $index) {
    <div class="bg-white shadow-sm text-center rounded-3xl py-6 w-full">
      <div class="playfair-font text-accent-500 text-4xl md:text-5xl">{{ item.number }}</div>
      <div class="mt-2 text-sm" [innerHTML]="item.title"></div>
    </div>
  }
</section>
