<div [class]="style()" class="card-container shadow-md rounded-3xl p-6 hpver:shadow-xl">
  <div class="icon-float pl-3xl absolute">
    <i [class]="icon()"></i>
  </div>
  <div class="flex flex-col">
    <span class="w-fit py-3 px-4 rounded-2xl icon">
      <i [class]="icon()" class="text-2xl!"></i>
    </span>
    <div class="flex flex-col z-1">
      <h3 class="text-2xl py-4">{{ title() }}</h3>
      <p class="font-light mb-4 text-sm leading-6">{{ description() }}</p>
      @if (itemsAdvantage.length > 0) {
        <div>
          @for (item of itemsAdvantage(); track $index) {
            <div [id]="'item-' + $index" class="item mb-4">
              <span><i class="pi pi-check-circle mr-2"></i></span>
              <span class="font-light"> {{ item }} </span>
            </div>
          }
        </div>
      }
      <a class="link mt-4 text-(--p-forest-lite)" [routerLink]="link().route">
        {{ link().title }} →</a
      >
    </div>
  </div>
</div>
