<section class="py-16 mx-auto font-sans max-w-[1180px]">
  <div class="text-center mb-12">
    <span class="white-badge">Cómo generamos valor para ambos</span>
    <h2 class="mt-6 text-5xl text-gray-950 mb-3">Valor en cada etapa del ciclo de talento</h2>
  </div>

  <p-table
    id="tabla-etapas"
    [value]="etapas"
    showGridlines
    [tableStyle]="{ 'font-size': '0.75rem', 'min-width': '50rem' }"
  >
    <ng-template #header>
      <tr>
        <th style="background: var(--color-mist)">Etapa</th>
        <th style="background: var(--color-mist)">Descubrir</th>
        <th style="background: var(--color-mist)">Evaluar</th>
        <th style="background: var(--color-mist)">Contratar/Postular</th>
        <th style="background: var(--color-mist)">Crecer</th>
      </tr>
    </ng-template>
    <ng-template #body let-etapa>
      <tr>
        <td class="font-bold">{{ etapa.etapa }}</td>
        <td>{{ etapa.descubrir }}</td>
        <td>{{ etapa.evaluar }}</td>
        <td>{{ etapa.contratarPostular }}</td>
        <td>{{ etapa.crecer }}</td>
      </tr>
    </ng-template>
  </p-table>
</section>
